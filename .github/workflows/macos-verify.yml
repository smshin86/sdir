name: macOS 0.6.3 rename verification

on:
  push:
    branches: [macos-0.6.3-verify]

permissions:
  contents: read
  actions: read

jobs:
  journeys:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SDIR-macos-arm64
          path: delivered
          run-id: '45332105291'
          github-token: ${{ github.token }}
      - run: python3 scripts/verify-macos-rename.py delivered/SDIR-macos-arm64-0.6.3.dmg gui-verification/journeys.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDIR-macos-GUI-verification
          path: gui-verification/
