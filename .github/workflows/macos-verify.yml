name: macOS 0.6.2 native file operations

on:
  push:
    branches: [macos-0.6.2-filesystem-verify]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.96.0 --profile minimal
      - shell: bash
        run: |
          set -o pipefail
          cargo +1.96.0 test --locked --test macos_journeys -- --nocapture | tee macos-native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SDIR-macOS-native-rename
          path: macos-native.log
