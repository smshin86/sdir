[package]
name = "sdir"
version = "0.6.1"
edition = "2024"
rust-version = "1.94"
default-run = "sdir"
description = "A responsive multi-pane Windows file manager with built-in scoped search"
license = "MIT"

[workspace]

[[bin]]
name = "SDIRIndexService"
path = "src/bin/sdir-index-service.rs"

[features]
default = []
desktop = ["dep:dioxus"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
goz-core = { git = "https://github.com/mustafaahci/goz", rev = "78ca353b8c0b227e47217c33c25d37fcff025e33" }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["desktop", "macro", "html", "signals", "hooks", "document", "launch"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
base64 = "0.22"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSFileManager", "NSObjCRuntime", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
goz-winfs = { git = "https://github.com/mustafaahci/goz", rev = "78ca353b8c0b227e47217c33c25d37fcff025e33" }
windows = { version = "0.62", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem"] }
windows-core = "0.62"
clipboard-win = { version = "5.4", features = ["std"] }

[build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Debug symbols and incremental copies dominated disposable development storage.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

